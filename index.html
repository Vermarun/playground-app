    <script>
      // Before first paint, so a dark-theme page never flashes white.
      (function () {
        var chosen = 'system'
        try { chosen = localStorage.getItem('lp-theme') || 'system' } catch (e) {}
        var dark = chosen === 'dark' || (chosen === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
